<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shorts Maker 7 - MP4変換テスト</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:18px}
button{padding:14px;width:100%;border:0;border-radius:8px;background:#2879e8;color:white;font-size:16px}
#status{white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<h1>Shorts Maker 7</h1>
<p>MP4変換エンジンの読み込みテスト</p>
<button id="check">変換エンジンを確認</button>
<p id="status">準備完了</p>
<script>
document.getElementById("check").onclick=async()=>{
 const status=document.getElementById("status");
 status.textContent="変換エンジンを読み込み中…";
 try{
   const r=await fetch("https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js");
   if(!r.ok)throw new Error("配信元から読み込めませんでした");
   const t=await r.text();
   if(!t.includes("FFmpeg"))throw new Error("ライブラリを確認できません");
   status.textContent="ライブラリの取得に成功！\n次に変換機能を組み込めます。";
 }catch(e){
   status.textContent="読み込み失敗：\n"+e.message+"\n通信環境を確認して、もう一度試してください。";
 }
};
</script>
</body>
</html>
