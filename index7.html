<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声抽出テスト</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:20px}
button,input{width:100%;box-sizing:border-box;padding:14px;margin:10px 0}
button{background:#2879e8;color:white;border:0;border-radius:8px;font-size:16px}
#status{white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>
<h1>動画から音声を抽出</h1>
<p>動画を選び、音声ファイルを作ります。</p>
<input id="video" type="file" accept="video/*">
<button id="go">音声を抽出</button>
<p id="status">動画を選択してください。</p>
<a id="save" style="display:none;color:#8ee6bd" download="audio.m4a">音声を保存</a>
<script>
const video = document.getElementById("video");
const status = document.getElementById("status");
const save = document.getElementById("save");
document.getElementById("go").onclick = async () => {
  const file = video.files[0];
  if (!file) {
    status.textContent = "先に動画を選んでください。";
    return;
  }
  status.textContent =
    "動画は読み込めました。\n" +
    "ファイル名: " + file.name + "\n" +
    "形式: " + file.type + "\n\n" +
    "このページだけでは動画から音声を直接抽出できないため、" +
    "次は対応する変換方法を案内します。";
  save.style.display = "none";
};
</script>
</body>
</html>
